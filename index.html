<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balcad Travel Agency - Admin & CRM</title>
    <meta name="description" content="Internal Admin and CRM web application for Balcad Travel Agency. Manage orders, customers, employees, payments, AR report, messaging, and transactions." />
    
    <!-- Primary Google Search & Browser Favicons (Google Search requires multiples of 48px square) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Web App Manifest for Android Chrome & Google Mobile Search -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="application-name" content="Balcad Travel" />

    <!-- OpenGraph & Social Sharing Meta Tags -->
    <meta property="og:title" content="Balcad Travel Agency - Admin & CRM" />
    <meta property="og:description" content="Internal Admin and CRM web application for Balcad Travel Agency. Manage orders, customers, employees, payments, AR report, messaging, and transactions." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/google-search-icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Balcad Travel Gold bt Emblem Logo" />
    <meta property="og:site_name" content="Balcad Travel Agency" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Balcad Travel Agency - Admin & CRM" />
    <meta name="twitter:description" content="Internal Admin and CRM web application for Balcad Travel Agency. Manage orders, customers, employees, payments, AR report, messaging, and transactions." />
    <meta name="twitter:image" content="/google-search-icon.png" />
    <meta name="twitter:image:alt" content="Balcad Travel Gold bt Emblem Logo" />

    <!-- Google Structured Data (Schema.org) for Search Results Logo Identification -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Balcad Travel Agency",
      "alternateName": ["Balcad Travel", "Balcad CRM", "bt"],
      "description": "Internal Admin and CRM web application for Balcad Travel Agency. Manage flight bookings, visas, hotels, transfers, payments, and customer accounts.",
      "logo": {
        "@type": "ImageObject",
        "url": "/google-search-icon.png",
        "width": 512,
        "height": 512
      },
      "image": "/google-search-icon.png"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
